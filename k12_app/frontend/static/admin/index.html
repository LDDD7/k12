<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>擎天学智 管理后台</title>
<style>
:root{
  --blue:#1F6FFF; --blue-dark:#1557d8;
  --purple:#7B61FF; --purple-light:#F0ECFF;
  --red:#FA5151; --orange:#FF9F0A; --green:#07C160;
  --ink:#1A1A1A; --ink-2:#5B6472; --ink-3:#9AA3B2;
  --line:#E9ECF2; --bg:#F5F7FA; --card:#FFFFFF;
  --radius:12px; --shadow:0 2px 10px rgba(20,30,60,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit}
.topbar{position:sticky;top:0;height:56px;background:linear-gradient(90deg,#fff 0%,#F7FAFF 100%);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:14px;z-index:50;box-shadow:0 1px 6px rgba(20,30,60,.04)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:.2px}
.logo .dot{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#1F6FFF,#7B61FF);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;box-shadow:0 3px 8px rgba(31,111,255,.28)}
.user-info{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-2);background:var(--bg);padding:5px 12px;border-radius:20px}
.user-info .logout{font-size:11px;padding:3px 10px;border-radius:6px;border:1px solid var(--red);color:var(--red);background:#fff;transition:.15s}
.user-info .logout:hover{background:var(--red);color:#fff}
.permission-badge{font-size:10px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.permission-badge.super{background:#FDEBEB;color:var(--red)}
.permission-badge.region{background:#FFF4E5;color:var(--orange)}
.permission-badge.normal{background:#EEF4FF;color:var(--blue)}
main{max-width:1360px;margin:0 auto;padding:16px 22px 44px}
.admin{display:grid;grid-template-columns:208px 1fr;gap:14px;min-height:calc(100vh - 116px)}
@media(max-width:900px){.admin{grid-template-columns:1fr}.anav{flex-direction:row;overflow:auto;padding:8px}.anav .aitem{white-space:nowrap}.acontent{padding:14px}}
.anav{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 8px;display:flex;flex-direction:column;gap:4px;height:fit-content;position:sticky;top:70px}
.anav .aitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--ink-2);font-size:13px;cursor:pointer;transition:.15s;border:1px solid transparent}
.anav .aitem:hover{background:var(--bg);color:var(--ink)}
.anav .aitem.active{background:#EEF4FF;color:var(--blue);font-weight:600;border-color:#D8E6FF}
.anav .aitem .ico{font-size:15px}
.acontent{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;overflow:auto;min-height:540px}
.acontent h2{font-size:19px;margin-bottom:4px}
.acontent .sub{color:var(--ink-3);font-size:12px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr!important}}
.kpi{background:var(--bg);border-radius:10px;padding:14px;border:1px solid transparent;transition:.15s}
.kpi:hover{border-color:var(--line);box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px}
.kpi .d{font-size:11px;margin-top:4px}
.kpi .d.up{color:var(--green)}.kpi .d.down{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.box{background:var(--bg);border-radius:10px;padding:14px}
.box h3{font-size:13px;margin-bottom:12px}
.eff{padding:7px 2px}
.eff-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.eff-name{font-size:13px;font-weight:600;color:var(--ink);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eff-num{font-size:12px;color:var(--ink-2);white-space:nowrap}
.eff-bar{height:14px;border-radius:7px;background:var(--bg);overflow:hidden}
.eff-fill{height:100%;border-radius:7px;min-width:6px;transition:width .4s ease}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{width:150px;height:150px;flex-shrink:0}
.dcnt{font-size:26px;font-weight:700;fill:var(--ink);text-anchor:middle}
.dlbl{font-size:11px;fill:var(--ink-2);text-anchor:middle}
.dlegend{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.dleg{display:flex;align-items:center;gap:8px;font-size:12px}
.dleg .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.dleg .dlb{flex:1;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dleg .dlv{color:var(--ink);font-weight:700}
.dleg .dlp{color:var(--ink-3);width:38px;text-align:right}
table.tbl{width:100%;border-collapse:collapse;font-size:12px;background:#fff}
table.tbl th{background:var(--bg);color:var(--ink-2);text-align:left;padding:10px 12px;font-weight:600;position:sticky;top:0;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td{padding:10px 12px;border-bottom:1px solid #F0F2F6;vertical-align:middle}
table.tbl tr:hover td{background:#FAFBFF}
table.tbl tr:last-child td{border-bottom:none}
.status{font-size:11px;padding:2px 8px;border-radius:8px;white-space:nowrap}
.status.s-ok{background:#EAF9F0;color:var(--green)}
.status.s-wait{background:#FFF4E5;color:var(--orange)}
.status.s-off{background:#F0F0F5;color:var(--ink-3)}
.status.s-ai{background:var(--purple-light);color:var(--purple)}
.progressbar{height:6px;background:#EEF1F6;border-radius:3px;overflow:hidden;min-width:70px;display:inline-block;vertical-align:middle;margin-right:6px}
.progressbar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;outline:none;background:#fff;transition:border-color .15s, box-shadow .15s}
.filters input:focus,.filters select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,111,255,.12)}
.filters .btn-blue{padding:8px 14px;font-size:12px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.pagebar{display:flex;justify-content:flex-end;gap:4px;margin-top:14px;align-items:center}
.pagebar button{min-width:28px;height:28px;border-radius:6px;border:1px solid var(--line);font-size:12px;color:var(--ink-2);padding:0 6px;background:#fff;transition:.15s}
.pagebar button:hover{border-color:var(--blue);color:var(--blue)}
.pagebar button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn{display:inline-block;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;transition:.15s}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 2px 6px rgba(31,111,255,.25)}.btn-blue:hover{background:var(--blue-dark)}
.btn-ghost{border:1px solid var(--line);color:var(--ink-2);background:#fff}.btn-ghost:hover{border-color:var(--blue);color:var(--blue);background:#F7FAFF}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-20px);background:#1A1A1A;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:300}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.permnote{font-size:11px;color:var(--ink-3);background:#FFF8EB;border:1px solid #F5E6C4;border-radius:8px;padding:8px 12px;margin-bottom:14px}
.hint{font-size:11px;color:var(--ink-3)}
.tip{display:inline-block;width:15px;height:15px;line-height:15px;text-align:center;border-radius:50%;background:var(--bg);border:1px solid var(--line);color:var(--ink-3);font-size:11px;font-style:normal;cursor:help;margin-left:6px;position:relative;vertical-align:middle}
.tip:hover::after{content:attr(data-tip);position:absolute;left:50%;transform:translateX(-50%);top:130%;width:max-content;max-width:240px;background:#1A1A1A;color:#fff;padding:7px 10px;border-radius:6px;font-size:11px;font-weight:400;line-height:1.5;white-space:normal;text-align:left;z-index:200;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.badge-stage{font-size:10px;padding:2px 8px;border-radius:8px;background:#EEF4FF;color:var(--blue)}
.permmatrix{font-size:12px;border-collapse:collapse}
.permmatrix td,.permmatrix th{border:1px solid var(--line);padding:8px 10px;text-align:center}
.permmatrix th{background:var(--bg)}
.permmatrix .yes{color:var(--green);font-weight:700}
.permmatrix .no{color:var(--ink-3)}
.drawer{position:fixed;top:52px;right:0;bottom:0;width:540px;background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.12);z-index:200;transform:translateX(110%);transition:transform .25s ease;display:flex;flex-direction:column}
@media(max-width:700px){.drawer{width:100%;top:0}}
.drawer.open{transform:none}
.drawer .dhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.drawer .dhead b{font-size:15px}
.drawer .dbody{flex:1;overflow:auto;padding:16px 20px}
.drawer .dsec{margin-bottom:18px}
.drawer .dsec-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:10px;letter-spacing:.3px}
.drawer .dsec-title::after{content:"";flex:1;height:1px;background:var(--line)}
.drawer .dsec-title .fico{font-size:13px}
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;background:var(--bg);border-radius:10px;padding:10px 14px}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:12px;gap:10px}
.kv .k{color:var(--ink-3);flex-shrink:0}
.kv .v{color:var(--ink);font-weight:500;text-align:right;word-break:break-all}
.timeline{border-left:2px solid var(--line);padding-left:14px}
.tl-item{position:relative;margin-bottom:14px}
.tl-item::before{content:"";position:absolute;left:-19px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--blue)}
.tl-item .tl-t{font-size:11px;color:var(--ink-3)}
.tl-item .tl-c{font-size:12px;margin-top:2px;line-height:1.6}
.tl-item .aiflag{font-size:10px;color:var(--purple);background:var(--purple-light);padding:0 6px;border-radius:6px;margin-left:4px}
.login-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#EEF4FF 0%,#F5F0FF 50%,#F0FAFF 100%);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:18px;padding:40px 34px;width:420px;max-width:94vw;box-shadow:0 12px 40px rgba(20,30,60,.16);border:1px solid #EEF1F8}
.login-card h2{font-size:21px;margin-bottom:6px;text-align:center}
.login-card .lsub{text-align:center;color:var(--ink-3);font-size:12px;margin-bottom:22px}
.login-card .field{margin-bottom:14px}
.login-card .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink-2)}
.login-card .field input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;outline:none;transition:border-color .15s, box-shadow .15s;background:#FAFBFF}
.login-card .field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,111,255,.12);background:#fff}
.login-card .login-btn{width:100%;padding:12px;background:linear-gradient(135deg,#1F6FFF,#4A8BFF);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;box-shadow:0 4px 12px rgba(31,111,255,.3);transition:.15s}
.login-card .login-btn:hover{background:linear-gradient(135deg,#1557d8,#1F6FFF)}
.login-card .lerr{color:var(--red);font-size:12px;text-align:center;margin-top:10px;display:none}
.login-card .hint-users{font-size:11px;color:var(--ink-3);line-height:1.7;background:var(--bg);border-radius:8px;padding:10px 14px;margin-top:14px}
.login-card .hint-users b{color:var(--ink)}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:12px}
.kv .k{color:var(--ink-3)}.kv .v{color:var(--ink);font-weight:500}
.modal-mask{position:fixed;inset:0;background:rgba(20,30,50,.38);z-index:400;display:none;align-items:center;justify-content:center;padding:18px}
.modal-mask.open{display:flex}
.modal{width:min(480px,100%);max-height:80vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 16px 48px rgba(20,30,60,.25)}
.modal-lg{width:min(680px,100%)}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-head b{font-size:15px}
.modal-body{padding:18px;font-size:13px;line-height:1.7}
.modal-close{font-size:22px;color:var(--ink-3);line-height:1}
/* ===== 表单工具类（网格 / 分组 / 字段） ===== */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.form-grid .field{margin:0}
.fspan2{grid-column:1/-1}
.fgroup{grid-column:1/-1;margin-top:2px}
.fgroup:first-child{margin-top:0}
.fgroup-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:10px;letter-spacing:.3px}
.fgroup-title::after{content:"";flex:1;height:1px;background:var(--line)}
.fgroup-title .fico{font-size:13px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:var(--ink-2)}
.field .req{color:var(--red);margin-left:2px}
.form-grid input,.form-grid select,.form-grid textarea{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;outline:none;background:#fff;transition:border-color .15s, box-shadow .15s}
.form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,111,255,.12)}
.form-grid input[readonly]{background:#F7F8FA;color:var(--ink-3)}
.form-actions{grid-column:1/-1;display:flex;gap:10px;margin-top:6px}
.form-actions .btn{flex:1;padding:10px}
.form-actions .btn-ghost{flex:0 0 auto;padding:10px 18px}
.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:#fff}
.section{margin-bottom:18px}
.sect{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink);margin:20px 0 10px}
.sect:first-child{margin-top:0}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}
.sect .btn{font-weight:500}
.cal-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px}
.cal-nav .mn{font-size:16px;font-weight:700;min-width:120px;text-align:center}
.calendar{width:100%;border-collapse:collapse;table-layout:fixed}
.calendar th{text-align:center;padding:8px 4px;font-size:12px;color:var(--ink-3);background:var(--bg)}
.calendar td{text-align:center;padding:6px 4px;height:56px;vertical-align:top;border:1px solid var(--line);cursor:pointer;transition:.12s;position:relative}
.calendar td:hover{background:#EEF4FF}
.calendar td.other{color:var(--ink-3);background:#fafafa;cursor:default}
.calendar td.today{background:#EEF4FF;font-weight:700}
.calendar td.selected{background:var(--blue);color:#fff}
.calendar td.selected .dnum{color:#fff}
.calendar td .dnum{display:block;font-size:13px;margin-bottom:2px}
.calendar td .dots{display:flex;justify-content:center;gap:3px;flex-wrap:wrap}
.calendar td .dots .dot{width:6px;height:6px;border-radius:50%;background:var(--blue)}
.calendar td .dots .dot.hi{background:var(--red)}
.day-detail{margin-top:14px;background:var(--bg);border-radius:10px;padding:14px}
.day-detail h3{font-size:13px;margin-bottom:10px}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><div class="dot">AI</div>擎天学智 管理后台</div>
  <span class="permission-badge super" id="permBadge" style="display:none"></span>
  <div class="user-info" id="userInfoBox" style="display:none">
    <span>👤</span><span id="loggedUser">未登录</span>
    <button class="logout" onclick="doLogout()">退出</button>
  </div>
</div>

<main>
  <div class="admin">
    <div class="anav" id="anav">
      <div class="aitem active" data-page="dash" onclick="adminPage('dash')"><span class="ico">📊</span>数据看板</div>
      <div class="aitem" data-page="emp" onclick="adminPage('emp')"><span class="ico">👥</span>员工管理</div>
      <div class="aitem" data-page="cust" onclick="adminPage('cust')"><span class="ico">📇</span>客户管理</div>
      <div class="aitem" data-page="order" onclick="adminPage('order')"><span class="ico">🧾</span>订单管理</div>
      <div class="aitem" data-page="followup" onclick="adminPage('followup')"><span class="ico">📝</span>跟进记录</div>
      <div class="aitem" data-page="tagm" onclick="adminPage('tagm')"><span class="ico">🏷️</span>标签管理</div>
      <div class="aitem" data-page="sched" onclick="adminPage('sched')"><span class="ico">📅</span>日程管理</div>
      <div class="aitem" data-page="kb" onclick="adminPage('kb')"><span class="ico">📚</span>资料库管理</div>
      <div class="aitem" data-page="aiset" onclick="adminPage('aiset')"><span class="ico">🧠</span>AI 设置</div>
      <div class="aitem" data-page="perms" onclick="adminPage('perms')"><span class="ico">🔐</span>权限与组织</div>
    </div>
    <div class="acontent" id="acontent">
      <div class="hint">登录后查看管理后台…</div>
    </div>
  </div>
</main>

<div class="drawer" id="drawer">
  <div class="dhead"><b id="drawerTitle">客户详情</b><button onclick="closeDrawer()" style="font-size:20px;color:var(--ink-3)">✕</button></div>
  <div class="dbody" id="drawerBody"></div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-mask" id="objModal" onclick="if(event.target===this)closeObjModal()">
  <div class="modal"><div class="modal-head"><b id="objModalTitle">详情</b><button class="modal-close" onclick="closeObjModal()">×</button></div>
  <div class="modal-body" id="objModalBody"></div></div>
</div>

<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px">
      <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#1F6FFF,#7B61FF);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700">AI</div>
      <span style="font-weight:700;font-size:17px">擎天学智</span>
    </div>
    <h2>管理后台登录</h2>
    <div class="lsub">AI 智能销售辅助系统</div>
    <div class="field"><label>用户名</label><input id="loginUser" placeholder="请输入用户名" autocomplete="username"></div>
    <div class="field"><label>密码</label><input id="loginPass" type="password" placeholder="请输入密码" autocomplete="current-password"></div>
    <button class="login-btn" onclick="doLogin()">登 录</button>
    <div class="lerr" id="loginError"></div>
  </div>
</div>

<script>
/* ===================== 全局状态 ===================== */
const API = "/api/admin";
let CUR_ADMIN = null;
let custFilter = "全部阶段";

/* ===================== 工具 ===================== */
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove("show"),2500);}
function escapeHtml(s){if(s==null)return"";return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function jsStr(s){if(s==null)return"";return String(s).replace(/["'&<>\\\r\n]/g,function(m){if(m==='"')return"\\x22";if(m==="'")return"\\x27";if(m==="&")return"\\x26";if(m==="<")return"\\x3c";if(m===">")return"\\x3e";if(m==="\\")return"\\\\";return"\\n";});}
function fmtDate(s){if(!s)return"—";return String(s).replace("T"," ").replace(".000","").slice(0,16);}
async function apiFetch(path,opts){
  opts=opts||{};
  opts.headers=opts.headers||{};
  opts.headers["Content-Type"]="application/json";
  opts.credentials="include";
  var r=await fetch(path,opts);
  if(r.status===401){toast("未登录或会话失效");doLogout();throw new Error("401");}
  var j=await r.json().catch(function(){return {success:false,error:"返回不是 JSON"};});
  if(!r.ok||!j.success){throw new Error(j.error||j.detail||r.statusText||"请求失败");}
  return j.data;
}

const CHART_PALETTE=["#1F6FFF","#7B61FF","#FF9F0A","#07C160","#FA5151","#00B8D9","#F76B15","#9AA3B2","#2BB673","#E845C3"];

function renderDonut(el, data, centerLabel){
  var rows=(data||[]).filter(function(d){return (d.value||0)>0;});
  if(!rows.length){el.innerHTML="<div class='hint'>暂无数据</div>";return;}
  var total=rows.reduce(function(a,d){return a+d.value;},0);
  var r=58, C=2*Math.PI*r, offset=0, segs="";
  rows.forEach(function(d,i){
    var len=d.value/total*C;
    var color=d.color||CHART_PALETTE[i%CHART_PALETTE.length];
    segs+='<circle cx="80" cy="80" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="24" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(0-offset)+'"></circle>';
    offset+=len;
  });
  var legend=rows.map(function(d,i){
    var color=d.color||CHART_PALETTE[i%CHART_PALETTE.length];
    var pct=Math.round(d.value/total*100);
    return '<div class="dleg"><span class="dot" style="background:'+color+'"></span><span class="dlb" title="'+escapeHtml(d.label)+'">'+escapeHtml(d.label)+'</span><span class="dlv">'+d.value+'</span><span class="dlp">'+pct+'%</span></div>';
  }).join("");
  el.innerHTML='<div class="donut-wrap"><svg viewBox="0 0 160 160" class="donut"><g transform="rotate(-90 80 80)">'+segs+'</g><text x="80" y="76" class="dcnt">'+total+'</text><text x="80" y="96" class="dlbl">'+(centerLabel||"总数")+'</text></svg><div class="dlegend">'+legend+'</div></div>';
}

function renderEffBars(el, items){
  var arr=(items||[]).filter(function(d){return d.completed_count>0||d.order_count>0;});
  if(!arr.length){el.innerHTML="<div class='hint'>暂无顾问业绩数据</div>";return;}
  var max=Math.max.apply(null,arr.map(function(d){return d.completed_count||0;}).concat([1]));
  var rows=arr.map(function(d,i){
    var color=CHART_PALETTE[i%CHART_PALETTE.length];
    var w=Math.max(Math.round((d.completed_count||0)/max*100),6);
    var amt=(d.total_amount||0).toLocaleString();
    return '<div class="eff"><div class="eff-top"><span class="eff-name" title="'+escapeHtml(d.advisor_name||d.user_id||"—")+'">'+escapeHtml(d.advisor_name||d.user_id||"—")+'</span><span class="eff-num">成单 '+d.completed_count+' · ¥'+amt+'</span></div>'+
      '<div class="eff-bar"><div class="eff-fill" style="width:'+w+'%;background:linear-gradient(90deg,'+color+',rgba(0,0,0,.15) 160%),'+color+'"></div></div></div>';
  }).join("");
  el.innerHTML=rows;
}

async function assignRoles(uid,name,wwid){
  try{
    const roles=await apiFetch(API+"/roles");
    const cur=await apiFetch(API+"/user_roles/"+encodeURIComponent(uid));
    var curCodes=[].concat((Array.isArray(cur)?cur:[]).map(x=>x.role_code)).filter(function(v,i,a){return a.indexOf(v)===i;});
    var opts=(roles||[]).map(r=>{
      var checked=curCodes.indexOf(r.role_code)>=0?" checked":"";
      var selfSuper=(uid===CUR_ADMIN.user_id&&r.role_code==="super_admin");
      var dis=selfSuper?" disabled":"";
      return '<label style="display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line)"><input type="checkbox" class="assignRoleChk" data-code="'+escapeHtml(r.role_code)+'"'+checked+dis+'><b>'+escapeHtml(r.role_name||r.role_code)+'</b><span class="hint">('+escapeHtml(r.data_scope||"")+')'+(selfSuper?" · 不可移除自身超管":'')+'</span></label>';
    }).join("");
    window._assignRoleTarget={uid:uid,wwid:wwid||"*"};
    openObjModal("分配权限 — "+name, (opts||"<div class='hint'>暂无角色</div>")+'<div class="form-actions"><button class="btn btn-ghost" onclick="closeObjModal()">取消</button><button class="btn btn-blue" onclick="saveAssignRoles()">保存权限</button></div>', "lg");
  }catch(e){openObjModal("错误",e.message);}
}
async function saveAssignRoles(){
  var t=window._assignRoleTarget;
  if(!t)return;
  var checked=document.querySelectorAll(".assignRoleChk");
  var sel=[];
  for(var k=0;k<checked.length;k++){if(checked[k].checked)sel.push(checked[k].getAttribute("data-code"));}
  try{
    var cur=await apiFetch(API+"/user_roles/"+encodeURIComponent(t.uid));
    var curCodes=[].concat((Array.isArray(cur)?cur:[]).map(x=>x.role_code)).filter(function(v,i,a){return a.indexOf(v)===i;});
    for(var i=0;i<sel.length;i++){
      if(curCodes.indexOf(sel[i])<0)await apiFetch(API+"/user_roles",{method:"POST",body:JSON.stringify({user_id:t.uid,role_code:sel[i],wework_account_id:t.wwid})});
    }
    for(var j=0;j<curCodes.length;j++){
      if(sel.indexOf(curCodes[j])<0)await apiFetch(API+"/user_roles/"+encodeURIComponent(t.uid)+"/"+encodeURIComponent(curCodes[j]),{method:"DELETE"});
    }
    closeObjModal(); toast("权限已更新 ✓");
  }catch(e){toast("保存失败："+e.message);}
}

function renderTagTable(){
  var filterEl=document.getElementById("tagFilter");
  var kw=(filterEl&&filterEl.value||"").trim().toLowerCase();
  var filtered=kw?_allTags.filter(function(t){

  }):_allTags;
  document.getElementById("tagTbody").innerHTML=filtered.length?filtered.map(function(t,i){
    var origIdx=_allTags.indexOf(t);

async function removeTagCustomer(tagId, externalId){
  if(!confirm("确认将该客户从此标签移除？"))return;
  try{
    await apiFetch(API+"/tags/"+encodeURIComponent(tagId)+"/customers/"+encodeURIComponent(externalId),{method:"DELETE"});
    toast("已移除该客户 ✓");
    var idx=_allTags.findIndex(function(x){return x.tag_id===tagId;});
    if(idx>=0)viewTagCustomers(idx);
  }catch(e){toast("移除失败："+e.message);}

    <div style="margin-bottom:10px"><button class="btn btn-blue btn-sm" onclick="showCreateSched()">＋ 新增日程</button></div>
    <div class="cal-nav"><button class="btn btn-ghost btn-sm" onclick="navCal(-1)">◀</button><span class="mn" id="calLabel"></span><button class="btn btn-ghost btn-sm" onclick="navCal(1)">▶</button></div>
    <table class="calendar"><thead><tr><th>日</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th></tr></thead><tbody id="calBody"></tbody></table>
    <div id="dayDetail" class="day-detail"><div class="hint">点击日历中的日期查看当天日程安排</div></div>`;
  await loadSchedData();
}
async function loadSchedData(){
  try{
    const j=await apiFetch(API+"/schedules");
    _schedData=(j.items||[]);
    renderCalendar();
    if(_calSelected)showDayScheds(_calSelected);
  }catch(e){document.getElementById("calBody").innerHTML='<tr><td colspan="7" style="color:var(--red)">'+escapeHtml(e.message)+'</td></tr>';}
}
function navCal(dir){
  _calMonth+=dir;
  if(_calMonth<1){_calMonth=12;_calYear--;}
  if(_calMonth>12){_calMonth=1;_calYear++;}
  _calSelected=null;
  document.getElementById("dayDetail").innerHTML='<div class="hint">点击日历中的日期查看当天日程安排</div>';
  renderCalendar();
}
function renderCalendar(){
  document.getElementById("calLabel").textContent=_calYear+'年'+_calMonth+'月';
  var today=new Date(); var todayStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  var map={};
  _schedData.forEach(function(s){
    var d=(s.start_time||"").slice(0,10);
    if(d){if(!map[d])map[d]=[]; map[d].push(s);}
  });
  var firstDay=new Date(_calYear,_calMonth-1,1);
  var startDow=firstDay.getDay();
  var daysInMonth=new Date(_calYear,_calMonth,0).getDate();
  var prevDays=new Date(_calYear,_calMonth-1,0).getDate();
  var cells=[];
  for(var i=startDow-1;i>=0;i--){
    var d=prevDays-i;
    var m=_calMonth-1||12; var y=m===12?_calYear-1:_calYear;
    var ds=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    cells.push({day:d,dateStr:ds,other:true});
  }
  for(var d=1;d<=daysInMonth;d++){
    var ds=_calYear+'-'+String(_calMonth).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    cells.push({day:d,dateStr:ds,other:false});
  }
  var remaining=7-(cells.length%7||7);
  if(remaining<7){
    for(var d=1;d<=remaining;d++){
      var m=_calMonth+1; var y=_calYear; if(m>12){m=1;y++;}
      var ds=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      cells.push({day:d,dateStr:ds,other:true});
    }
  }
  var rows=[];
  for(var i=0;i<cells.length;i+=7){rows.push(cells.slice(i,i+7));}
  var html='';
  rows.forEach(function(row){
    html+='<tr>';
    row.forEach(function(c){
      var hasEvents=!!map[c.dateStr];
      var hasHi=hasEvents&&map[c.dateStr].some(function(s){return s.priority==='高';});
      var cls=[];
      if(c.other)cls.push('other');
      if(c.dateStr===todayStr)cls.push('today');
      if(c.dateStr===_calSelected)cls.push('selected');
      var dots='';
      if(hasEvents&&!c.other){
        dots='<div class="dots">'+map[c.dateStr].slice(0,3).map(function(s){return '<span class="dot'+(s.priority==='高'?' hi':'')+'"></span>';}).join('')+'</div>';
      }
      html+='<td class="'+cls.join(' ')+'"'+(c.other?'':' onclick="showDayScheds(\''+jsStr(c.dateStr)+'\')"')+'><span class="dnum">'+c.day+'</span>'+dots+'</td>';
    });
    html+='</tr>';
  });
  document.getElementById("calBody").innerHTML=html;
}
function showDayScheds(dateStr){
  _calSelected=dateStr;
  renderCalendar();
  var items=_schedData.filter(function(s){return (s.start_time||"").slice(0,10)===dateStr;});
  _dayScheds=items;
  var div=document.getElementById("dayDetail");
  if(items.length===0){
    div.innerHTML='<h3>'+dateStr+'</h3><div class="hint">当天暂无日程安排</div>';
    return;
  }
  var prioMap={'高':'🔴 高','中':'🟡 中','低':'🟢 低'};
  div.innerHTML='<h3>'+dateStr+' · '+items.length+' 项日程</h3>'+items.map(function(s,i){
    var status=s.status||'待确认';
    var stCls=status==='已确认'?'s-ok':(status==='已取消'?'s-off':'s-wait');
    return '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><div><strong>'+escapeHtml(s.title||'—')+'</strong><div class="hint" style="margin-top:2px">'+escapeHtml(s.customer_name||'—')+' · '+escapeHtml(s.external_id||'')+'</div></div><div style="text-align:right"><span class="status '+stCls+'">'+escapeHtml(status)+'</span><div class="hint" style="margin-top:2px">'+(prioMap[s.priority]||s.priority||'—')+'</div><div class="hint">'+escapeHtml(fmtDate(s.start_time))+' — '+escapeHtml(fmtDate(s.end_time))+'</div><div style="margin-top:6px"><button class="btn btn-ghost btn-sm" onclick="editSched('+i+')">编辑</button> <button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="delSched('+i+')">删除</button></div></div></div>';
  }).join('');
}

        <div class="kpi"><div class="l">🤖 兜底率</div><div class="v">${t.fallback_rate!=null?t.fallback_rate+"%":"—"}</div><div class="d">初期30-40%，连续一周>50%需补资料</div></div>
        <div class="kpi"><div class="l">✏️ 修改率</div><div class="v">${t.modify_rate!=null?t.modify_rate+"%":"—"}</div><div class="d">AI 建议被顾问修改后发送</div></div>
        <div class="kpi"><div class="l">⚠️ 推理失败率</div><div class="v">${t.reasoning_fail_rate!=null?t.reasoning_fail_rate+"%":"—"}</div><div class="d">初期≤25%，连续一周>40%需排查</div></div>
        <div class="kpi"><div class="l">✅ 采纳率</div><div class="v">${t.adopt_rate!=null?t.adopt_rate+"%":"—"}</div><div class="d">采纳÷(采纳+丢弃)</div></div>
      </div>
      <div class="hint" style="margin-top:8px">盲区（近30天）：兜底 ${st.blind_spot?st.blind_spot.fallback||0:0} · 未命中 ${st.blind_spot?st.blind_spot.not_found||0:0} · 推理失败 ${st.blind_spot?st.blind_spot.reasoning_failed||0:0}</div>`;
  }catch(e){document.getElementById("aiStats").innerHTML='<div class="hint">'+escapeHtml(e.message)+'</div>';}
  renderBlindSpots(); renderFeedbackList();
}
async function saveAiConfig(){
  const body={};
  const sw=document.getElementById("reasoningSwitch").checked;
  body.reasoning_enabled=sw;
  const ms=parseInt(document.getElementById("maxSteps").value,10);
  if(ms>=1&&ms<=5)body.max_steps=ms;
  const sc=parseFloat(document.getElementById("minScore").value);
  if(!isNaN(sc)&&sc>=0&&sc<=1)body.min_score=sc;
  try{
    await apiFetch(API+"/ai/config",{method:"PUT",body:JSON.stringify(body)});
    toast("配置已保存，秒级生效 ✓"+(sw?"":"（综合推理已关闭，AI 退回简化模式）"));
  }catch(e){toast(e.message);}
}
async function renderBlindSpots(){
  const el=document.getElementById("blindList"); if(!el)return;
  try{
    const j=await apiFetch(API+"/ai/blind_spots?page=1&page_size=10");
    const items=j.items||[];
    if(!items.length){el.innerHTML='<div class="hint">暂无盲区数据（AI 兜底/未命中时会自动记录原始问题）</div>';return;}
    el.innerHTML=items.map(b=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)">
      <div style="font-size:12px">${escapeHtml(b.original_question)}</div>
      <div class="hint" style="margin-top:3px">${b.scene_type==="fallback"?"兜底":b.scene_type==="not_found"?"未命中":"推理失败"} · ${escapeHtml(b.advisor_name||"")} · ${escapeHtml(fmtDate(b.created_at))}</div>
    </div>`).join("");
  }catch(e){el.innerHTML='<div class="hint">加载失败：'+escapeHtml(e.message)+'</div>';}
}
async function renderFeedbackList(){
  const el=document.getElementById("fbList"); if(!el)return;
  try{
    const j=await apiFetch(API+"/ai/feedback?page=1&page_size=10");
    const items=j.items||[];
    if(!items.length){el.innerHTML='<div class="hint">暂无顾问反馈（侧边栏反馈按钮采集）</div>';return;}
    el.innerHTML=items.map(f=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)">
      <div style="font-size:12px">${f.signal_type==="positive"?"👍 有帮助":"👎 没帮助/方向不对"} <span class="hint">${escapeHtml(f.task_type||"")} · ${escapeHtml(f.external_id||"")}</span></div>
      <div class="hint" style="margin-top:3px">${escapeHtml(fmtDate(f.created_at))}</div>
    </div>`).join("");
  }catch(e){el.innerHTML='<div class="hint">加载失败：'+escapeHtml(e.message)+'</div>';}
}

/* ===================== 启动 ===================== */
document.getElementById("loginPass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
document.getElementById("loginUser").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("loginPass").focus();});
// 启动时尝试 /me
(async ()=>{
  try{
    const r=await fetch(API+"/me",{credentials:"include"});
    const j=await r.json();
    if(r.ok&&j.success){
      CUR_ADMIN={user_id:j.data.user_id,name:j.data.name,data_scope:j.data.data_scope,role_codes:j.data.role_codes||[]};
      document.getElementById("loginOverlay").style.display="none";
      document.getElementById("userInfoBox").style.display="flex";
      document.getElementById("loggedUser").textContent=`${CUR_ADMIN.name}（${CUR_ADMIN.user_id}）`;
      const badge=document.getElementById("permBadge");
      const [cls,label]=permBadgeFor(CUR_ADMIN.data_scope);
      badge.className="permission-badge "+cls;badge.textContent=label;badge.style.display="inline";
      adminPage("dash");
    }
  }catch(_){}
})();
</script>
